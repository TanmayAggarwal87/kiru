[project]
name = "kiru-worker"
version = "0.1.0"
description = "AI worker for Kiru video processing pipeline"
authors = [
    {name = "Tanmay Aggarwal", email = "tanmayagg.2005@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.14.3,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "tenacity (>=9.2.1,<10.0.0)",
    "typer (>=0.27.3,<0.28.0)",
    "structlog (>=26.1.0,<27.0.0)"
]

[project.scripts]
kiru-worker = "kiru_worker.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "kiru_worker", from = "src"}]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.4,<0.18.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "datamodel-code-generator (>=0.90.0,<0.91.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # unused arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "model: tests that load AI/ML models (slow, skipped in fast CI)",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
